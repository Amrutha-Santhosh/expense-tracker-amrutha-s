<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    
    <header class="app-header">
      <h1>💰 Expense Tracker</h1>
    </header>

    <section class="summary-cards">
      <div class="card card-balance">
        <span class="card-label">Balance</span>
        <span class="card-value" id="balance">₹0.00</span>
      </div>
      <div class="card card-income">
        <span class="card-label">Income</span>
        <span class="card-value" id="total-income">₹0.00</span>
      </div>
      <div class="card card-expense">
        <span class="card-label">Expenses</span>
        <span class="card-value" id="total-expense">₹0.00</span>
      </div>
    </section>

    <div class="main-grid">
      <aside class="left-column">
        <section class="form-section">
          <h2 id="form-title">Add Transaction</h2>
          <form id="transaction-form" novalidate>
            <input type="hidden" id="edit-id" value="" />

            <div class="form-group">
              <label for="type">Type</label>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="type" value="income" checked />
                  <span class="radio-custom income-radio"></span>
                  Income
                </label>
                <label class="radio-label">
                  <input type="radio" name="type" value="expense" />
                  <span class="radio-custom expense-radio"></span>
                  Expense
                </label>
              </div>
            </div>

            <div class="form-group">
              <label for="amount">Amount (₹)</label>
              <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required />
              <span class="error-msg" id="amount-error"></span>
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="">-- Select Category --</option>
                <optgroup label="Income" id="income-categories">
                  <option value="Salary">Salary</option>
                  <option value="Freelance">Freelance</option>
                  <option value="Investments">Investments</option>
                  <option value="Business">Business</option>
                  <option value="Other Income">Other Income</option>
                </optgroup>
                <optgroup label="Expense" id="expense-categories">
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Bills">Bills</option>
                  <option value="Health">Health</option>
                  <option value="Education">Education</option>
                  <option value="Rent">Rent</option>
                  <option value="Other Expense">Other Expense</option>
                </optgroup>
              </select>
              <span class="error-msg" id="category-error"></span>
            </div>

            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" required />
              <span class="error-msg" id="date-error"></span>
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <input type="text" id="description" placeholder="Enter description" maxlength="100" required />
              <span class="error-msg" id="description-error"></span>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="submit-btn">Add Transaction</button>
              <button type="button" class="btn btn-secondary" id="cancel-btn" style="display:none;">Cancel</button>
            </div>
          </form>
        </section>

        <section class="chart-section">
          <h2>Category Breakdown</h2>
          <div class="chart-container" id="chart-container">
            <canvas id="category-chart" width="300" height="300"></canvas>
            <p class="no-data-msg" id="chart-no-data">No expense data to display.</p>
          </div>
          <div class="chart-legend" id="chart-legend"></div>
        </section>
      </aside>

      <main class="right-column">
        <section class="filter-section">
          <h2>Transactions</h2>
          <div class="filters">
            <div class="filter-group">
              <label for="filter-type">Type</label>
              <select id="filter-type">
                <option value="all">All</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filter-category">Category</label>
              <select id="filter-category">
                <option value="all">All Categories</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="filter-month">Month</label>
              <input type="month" id="filter-month" />
            </div>
          </div>
        </section>

        <section class="transaction-list-section">
          <div id="transaction-list" class="transaction-list">
            <p class="no-data-msg" id="list-no-data">No transactions found. Add one above!</p>
          </div>
        </section>

        <section class="monthly-summary-section">
          <h2>Monthly Summary</h2>
          <div id="monthly-summary" class="monthly-summary-grid">
            <p class="no-data-msg" id="summary-no-data">No data available.</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
